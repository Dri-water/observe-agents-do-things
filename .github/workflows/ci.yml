name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
        exclude:
          - os: macos-latest
            node: 20
          - os: windows-latest
            node: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npm run build:examples
      - name: Smoke test the CLI
        shell: bash
        run: |
          node packages/server/dist/cli.js --version
          node packages/server/dist/cli.js sessions --since 1h
      - name: Build and smoke test the npm package
        shell: bash
        run: |
          node scripts/build-cli.mjs
          node packages/cli/dist/cli.js --version
          (cd packages/cli && npm pack --dry-run)

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Integration test in a real VS Code
        run: xvfb-run -a npm test --workspace apps/vscode
      - name: Package
        working-directory: apps/vscode
        run: npx --yes @vscode/vsce package --no-dependencies
