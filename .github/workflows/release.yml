# Publishes a release when a version tag is pushed (see scripts/release.mjs).
# npm uses trusted publishing (configured on npmjs.com, no token). The VS Code
# Marketplace publishes only when VSCE_PAT (an Azure DevOps token with
# Marketplace: Manage) is set as a repository secret. Editors that use Open VSX
# (Cursor, Windsurf, VSCodium) install the .vsix from the GitHub release.
# The build job never sees a token; each publish job only sees its own.
name: Release

on:
  push:
    tags: ['v*']
  # Run by hand for a dry run: build, test and package without publishing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches the published versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in apps/vscode/package.json packages/cli/package.json; do
            have=$(node -p "require('./$f').version")
            [ "$have" = "$v" ] || { echo "$f is $have, tag is $v"; exit 1; }
          done
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: VS Code extension test
        run: xvfb-run -a npm test --workspace apps/vscode
      - name: Package
        run: |
          (cd apps/vscode && npx --yes @vscode/vsce package --no-dependencies --out ../../observe-agents-do-things.vsix)
          node scripts/build-cli.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            observe-agents-do-things.vsix
            packages/cli/

  github:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          vsix="observe-agents-do-things-${GITHUB_REF_NAME#v}.vsix"
          mv observe-agents-do-things.vsix "$vsix"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "$vsix" --clobber \
            || gh release create "$GITHUB_REF_NAME" "$vsix" --title "$GITHUB_REF_NAME" --generate-notes

  marketplace:
    name: VS Code Marketplace
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.VSCE_PAT != ''
        with:
          name: release
      - uses: actions/setup-node@v5
        if: env.VSCE_PAT != ''
        with:
          node-version: 22
      - if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath observe-agents-do-things.vsix
      - if: env.VSCE_PAT == ''
        run: echo "::notice::VSCE_PAT is not set; skipped the VS Code Marketplace."

  npm:
    name: npm
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing: npmjs.com trusts this workflow, so no token is stored anywhere.
      - name: Publish
        working-directory: packages/cli
        run: npm publish --access public
